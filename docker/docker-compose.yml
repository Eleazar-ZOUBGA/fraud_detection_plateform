services:
  # 1. Base de données PostgreSQL pour les données applicatives et le backend store MLflow
  postgres:
    image: postgres:15-alpine
    container_name: fraud_postgres
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password
      POSTGRES_DB: fraud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 2. Serveur de suivi des expériences MLflow
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: fraud_mlflow
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=postgresql://fraud_user:fraud_password@postgres:5432/fraud_db
    entrypoint: sh -c "pip install --no-cache-dir psycopg2-binary && exec mlflow server \"$$@\"" --
    command:
      - --backend-store-uri
      - postgresql://fraud_user:fraud_password@postgres:5432/fraud_db
      - --default-artifact-root
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mlflow_artifacts:/mlflow/artifacts

  # 3. Backend API FastAPI
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: fraud_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://fraud_user:fraud_password@postgres:5432/fraud_db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

volumes:
  postgres_data:
  mlflow_artifacts: